[package]
authors = ["Tensorbinge <tensorbinge@gmail.com>"]
categories = ["development-tools::debugging"]
description = "A fast, minimal logging library for Rust, designed for performance-critical applications, e.g. high-frequency trading."
edition = "2024"
keywords = ["logging", "low-latency", "performance"]
license = "MIT OR Apache-2.0"
name = "ticklog"
repository = "https://github.com/tensorbinge/ticklog"
version = "0.1.2"

[dependencies]
core_affinity = "0.8"
crossbeam-utils = "0.8"
r3 = { git = "https://github.com/Utishnik/mytestrs" }
ringbuffer = { version = "0.16", optional = true }
ringbuf = { version = "0.5", optional = true }
rtrb = { version = "0.4", optional = true }
spin = { version = "0.12.3", features = ["std"] }
triple_buffer = { version = "9.0", optional = true }

# Patch the git dependency with a vendored copy of `r3` that does not install
# a process-wide #[global_allocator] (see the notes in vendor/r3/Cargo.toml).
[patch."https://github.com/Utishnik/mytestrs"]
r3 = { path = "vendor/r3" }

# `fifo-backend` is an internal marker: every byte-streaming backend
# (ringbuffer, ringbuf, triple_buffer) enables it. The crate-local custom
# zero-copy ring is the only backend that does not, so `cfg(feature =
# "fifo-backend")` selects the staging commit/drain path and
# `cfg(not(feature = "fifo-backend"))` selects the custom slot path.
[features]
default = []
backend-ringbuffer = ["dep:ringbuffer", "fifo-backend"]
backend-ringbuf = ["dep:ringbuf", "fifo-backend"]
backend-rtrb = ["dep:rtrb", "fifo-backend"]
backend-triple-buffer = ["dep:triple_buffer", "fifo-backend"]
fifo-backend = []

# Quill-style cached reader position: the producer's capacity check trusts a
# possibly-stale cache of the drain's tail and never loads the drain's cache
# line on the fast path. The real tail is refreshed only when the cache says
# the ring is near full. Occupancy computed from a stale tail is conservative
# (real tail >= cached), so the producer can never overwrite a slot the drain
# has not consumed. Benchmark-only; not part of the default configuration.
fast-tail-cache = []

# Benchmark-only: the producer publishes its write position to the drain as a
# lagging `head` watermark once per `WATERMARK_HEAD_RECORDS` publishes instead
# of per record, removing the per-record producer<->drain cache-line ping-pong
# on `head`. `reserve` bookkeeping uses a producer-private position; the
# watermark is flushed on every segment handoff, so the drain lags by at most
# one watermark and never loses records. Not part of the default
# configuration.
watermark-head = []

[dev-dependencies]
criterion = {version = "0.5", features = ["html_reports"]}
env_logger = "0.11"
log = "0.4"
logroller = "0.1.12"
loom = "0.7"
slog = "2.7"
slog-async = "2.8"
tempfile = "3"
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3"

# Custom cfg used for model-checking runs (`RUSTFLAGS="--cfg ticklog_loom"`).
# Named `ticklog_loom` (not `loom`) so a global RUSTFLAGS cannot enable other
# crates' internal `cfg(loom)` test scaffolding (e.g. `boxcar`).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ticklog_loom)"] }

# Ticklog regression benches

[[bench]]
harness = false
name = "single_record"

[[bench]]
harness = false
name = "message_types"

[[bench]]
harness = false
name = "end_to_end"

# Latency comparison

[[bench]]
harness = false
name = "latency_vs_baseline"
path = "benches/cmp/latency/latency_vs_baseline.rs"

[[bench]]
harness = false
name = "latency_vs_tracing"
path = "benches/cmp/latency/latency_vs_tracing.rs"

[[bench]]
harness = false
name = "latency_vs_env_logger"
path = "benches/cmp/latency/latency_vs_env_logger.rs"

[[bench]]
harness = false
name = "latency_vs_slog"
path = "benches/cmp/latency/latency_vs_slog.rs"

# Throughput comparison

[[bench]]
harness = false
name = "throughput_vs_baseline"
path = "benches/cmp/throughput/throughput_vs_baseline.rs"

[[bench]]
harness = false
name = "throughput_vs_tracing"
path = "benches/cmp/throughput/throughput_vs_tracing.rs"

[[bench]]
harness = false
name = "throughput_vs_env_logger"
path = "benches/cmp/throughput/throughput_vs_env_logger.rs"

[[bench]]
harness = false
name = "throughput_vs_slog"
path = "benches/cmp/throughput/throughput_vs_slog.rs"

# Scaling comparison

[[bench]]
harness = false
name = "scaling_vs_baseline"
path = "benches/cmp/scaling/scaling_vs_baseline.rs"

[[bench]]
harness = false
name = "scaling_vs_tracing"
path = "benches/cmp/scaling/scaling_vs_tracing.rs"

[[bench]]
harness = false
name = "scaling_vs_env_logger"
path = "benches/cmp/scaling/scaling_vs_env_logger.rs"

[[bench]]
harness = false
name = "scaling_vs_slog"
path = "benches/cmp/scaling/scaling_vs_slog.rs"

[[example]]
name = "sink_custom"
path = "examples/sinks/custom.rs"

[[example]]
name = "sink_tracing_appender"
path = "examples/sinks/tracing_appender.rs"

[[example]]
name = "sink_logroller"
path = "examples/sinks/logroller.rs"

[[example]]
name = "sink_stderr"
path = "examples/sinks/stderr.rs"

[profile.release]
lto = "fat"
codegen-units = 1
