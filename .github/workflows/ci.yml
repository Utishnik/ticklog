name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # `.cargo/config.toml` sets target-cpu=native. rust-cache can restore
  # proc-macros/artifacts built for a different runner CPU, which makes
  # rustc die with SIGILL (seen on `r3` via hotpath_macros). Empty RUSTFLAGS
  # overrides the config for every CI job; local builds keep native.
  RUSTFLAGS: ""

jobs:
  # Build + test across all OS targets
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}

      - name: Run tests (lib + integration)
        run: cargo test --lib --tests

      - name: Run doc tests
        run: cargo test --doc

      - name: Compile examples
        run: cargo build --examples

      - name: Compile benchmarks
        run: cargo bench --no-run

  # Format + clippy
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # Miri
  miri:
    name: miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: miri

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: miri

      - name: cargo miri setup
        run: cargo +nightly miri setup

      - name: Run Miri tests
        run: |
          cargo +nightly miri test --lib cursor_
          cargo +nightly miri test --lib write_record
          cargo +nightly miri test --lib producer_and_drain
          cargo +nightly miri test --lib thread_buf
        env:
          # tree-borrows: the aliasing model under test.
          # ignore-leaks: drain tests intentionally Box::leak tiny Site
          # descriptors (stand-in for constant promotion).
          MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-ignore-leaks

  # Doc build check
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs

      - name: Build docs
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  # Loom model-checking for the lock-free ring / shutdown protocols.
  # The cfg is `ticklog_loom` (not `loom`) so a global RUSTFLAGS cannot
  # enable other crates' internal `cfg(loom)` scaffolding.
  loom:
    name: loom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: loom

      - name: Run loom model tests
        run: cargo test --lib --release -- loom_
        env:
          RUSTFLAGS: --cfg ticklog_loom
