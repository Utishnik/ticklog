[package]
name = "ticklog-gungraun-harness"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.85"

[dependencies]
ticklog = { path = "../../.." }
gungraun = "0.19.4"

[features]
# The gungraun harness version always benchmarks the custom-ring under the
# crate's Drop policy, so it mirrors the "policy-drop" feature of the classic
# parallel harness without toggling anything.
policy-drop = []

# Enable Callgrind flamegraph generation for the ticklog_ring group. The
# flamegraphs are built for the L1 cache-miss EventKinds (D1 read+write
# misses) only, so each SVG stack is attributed to cache misses, not bare
# instruction counts. Callgrind already simulates the cache by default
# (--cache-sim=yes), so no extra tool args are needed.
#
#     GUNGRAUN_NOCAPTURE=true cargo bench --features flamegraph
flamegraph = []

[[bench]]
name = "ticklog_ring"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1