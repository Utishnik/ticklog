[package]
name = "ticklog-cross-lang-harness"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ticklog = { path = "../../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Forward ticklog's experimental SPSC ring backends (mutually exclusive, like
# the crate's own features; none = the crate-local custom ring).
[features]
backend-ringbuffer = ["ticklog/backend-ringbuffer"]
backend-ringbuf = ["ticklog/backend-ringbuf"]
backend-rtrb = ["ticklog/backend-rtrb"]
backend-triple-buffer = ["ticklog/backend-triple-buffer"]
# Selects the build-time Backpressure policy the logging code runs under.
policy-block = []
# Drop: the producer never blocks; if the FIFO is full the record is discarded
# and `info!` returns immediately (ticklog's default, crate-side Drop policy).
policy-drop = []
policy-nanolog = []
policy-quill = []
# Per-thread-ring fast path: quill-style cached reader position (the producer
# never loads the drain's tail on the hot path). Uses the Quill policy.
policy-fast = ["policy-quill", "ticklog/fast-tail-cache"]
# Watermark-batched `head` publish (one drain-facing store per 1000 records
# instead of per record). Uses the Quill policy.
policy-watermark = ["policy-quill", "ticklog/watermark-head"]
# Fast-tail-cache + watermark-batched publish combined.
policy-fastwm = ["policy-fast", "ticklog/watermark-head"]
# Hot-path cycle profiler: per-stage rdtsc breakdown written to stderr after
# every config.
hotpath-profiler = ["ticklog/hotpath-profiler"]

[profile.release]
lto = "fat"
codegen-units = 1
